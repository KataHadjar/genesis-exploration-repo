[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-exploration"
version = "0.1.0"
description = "Reproducible experiments and results for Genesis"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "genesis-world>=1.3.3",
    "numpy>=1.26.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"
